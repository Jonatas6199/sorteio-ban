<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorteio de Ban</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0a192f;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      padding: 20px;
      max-width: 400px;
      width: 100%;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    button {
      background: #1e3a8a;
      color: white;
      border: none;
      padding: 15px 20px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      transition: 0.3s;
    }

    button:hover {
      background: #3b82f6;
    }

    .result {
      margin-top: 30px;
      display: none;
    }

    .result img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin-top: 15px;
      object-fit: cover;
      border: 3px solid #3b82f6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎲 Sorteio de Ban dos Vacilões</h1>
    <button onclick="sortear()">Sortear</button>

    <div class="result" id="resultado">
      <h2 id="nome"></h2>
      <img id="foto" src="" alt="Foto">
    </div>
  </div>

  <script>
    function sortear() {
      const nome = "Gustavo Mioli";
      const foto = "mioli.png"; 

      document.getElementById('nome').innerText = nome + " foi banido! 🚫";
      document.getElementById('foto').src = foto;
      document.getElementById('resultado').style.display = 'block';
    }
  </script>
</body>
</html>
